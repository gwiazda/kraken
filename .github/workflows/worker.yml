# Publishes the Fakturownia middleman (worker/) to Cloudflare after a merge to main that changes it, or by hand
# (Actions → Publish Fakturownia middleman → Run workflow; main only) (docs/FAKTUROWNIA.md). Tests and the type check
# run first; nothing is published if they fail. Needs two repository secrets: CLOUDFLARE_API_TOKEN (a Cloudflare token
# that can only edit Workers) and CLOUDFLARE_ACCOUNT_ID. Until they are set, it says so and stops without failing.
name: Publish Fakturownia middleman

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'src/config.ts'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time, in order: a later merge never ends up overwritten by an earlier one.
concurrency:
  group: worker-publish
  cancel-in-progress: false

jobs:
  publish:
    # Only reviewed code (main) is ever published, also when run by hand.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      # Cloudflare's publishing tool, exactly as locked in worker/package-lock.json; its install scripts are not run.
      - run: npm ci --prefix worker --ignore-scripts --no-audit --no-fund
      - name: Publish to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare is not set up yet (repository secrets missing): nothing published."
            exit 0
          fi
          npx --prefix worker wrangler deploy --config worker/wrangler.toml
