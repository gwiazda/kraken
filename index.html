<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Strict Content Security Policy: only this site's own files and the named Google services may run.
         accounts.google.com = sign-in, apis.google.com + docs.google.com = file picker, sheets.googleapis.com = data.
         Inline styles are allowed because the Google Picker adds its own; inline scripts stay blocked. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://sheets.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com https://docs.google.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="robots" content="noindex, nofollow" />
    <title>Kraken</title>
    <link rel="icon" type="image/png" href="./assets/brand/logo-stacked-lime.png" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header class="site-header">
      <img class="logo" src="./assets/brand/logo-horizontal-lime-on-black.png" alt="Krak Coffee Roasters" />
      <span class="app-name">Kraken</span>
    </header>
    <main id="app"></main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
